name: Deploy Pages

# Publishes the boarding pass generator at boardingpass.nichtlegacy.com. The
# site is plain HTML, CSS and JavaScript under site/ and ships as committed:
# there is no build step, so the artifact is the folder itself.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, newest wins: the page is a snapshot of main, so an
# in-flight older build has nothing worth finishing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check local references
        # A typo in a src, href or og:image would 404 in production, where nobody looks.
        run: |
          missing=0
          while read -r ref; do
            [ -f "site/$ref" ] || { echo "referenced but missing: $ref" >&2; missing=1; }
          done < <({ grep -ho '\(src\|href\)="[^":#?]*"' site/index.html site/404.html site/embed.html \
                     | sed 's/.*="//; s/"$//'
                   # absolute links in meta tags, JSON-LD, robots.txt and the sitemap (og.jpg, sitemap.xml, ...)
                   grep -ho 'https://boardingpass\.nichtlegacy\.com/[^"?#< ]*' site/index.html site/robots.txt site/sitemap.xml \
                     | sed 's|^https://boardingpass\.nichtlegacy\.com/||'
                   grep -o '"src": *"[^"]*"' site/site.webmanifest | sed 's/.*"\([^"]*\)"$/\1/'
                   echo CNAME; echo 404.html; } | sed 's|^/||' | grep -v '^$' | sort -u)
          exit $missing

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
