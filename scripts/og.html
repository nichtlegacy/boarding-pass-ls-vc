<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="../site/"><!-- photo hrefs in the ticket SVG are relative to site/ -->
<title>og image — Flight GT406</title>
<!--
  Source of site/og.jpg (1200×630) and .github/images/social-preview.png (open with #1280x640).
  Rendered by scripts/render.sh. The backdrop is the landing page's hero photo, the ticket and the ghost
  passenger come from the site modules, so the card is always the shipped Night ticket with "Your name here".
  Sized to read at ~500px wide (Discord, WhatsApp, Slack): headline ≥ 64px, nothing that matters under 18px.
  Everything important sits inside the central 1200×600 band, so X's 2:1 crop loses nothing.
-->
<style>
@font-face{font-family:"Onest";src:url("../site/fonts/onest-var.woff2") format("woff2");font-weight:100 900}
@font-face{font-family:"Urbanist";src:url("../site/fonts/urbanist-500.woff2") format("woff2");font-weight:500}
@font-face{font-family:"GT406 Sans";src:url("../site/fonts/carlito-400.woff2") format("woff2");font-weight:400;font-style:normal}
@font-face{font-family:"GT406 Sans";src:url("../site/fonts/carlito-700.woff2") format("woff2");font-weight:700;font-style:normal}
@font-face{font-family:"GT406 Sans";src:url("../site/fonts/carlito-700i.woff2") format("woff2");font-weight:700;font-style:italic}
@font-face{font-family:"Archivo Expanded";src:url("../site/fonts/archivo-expanded-900.woff2") format("woff2");font-weight:900;font-style:normal}
@font-face{font-family:"Arimo";src:url("../site/fonts/arimo-700i.woff2") format("woff2");font-weight:700;font-style:italic}
:root{--w:1200px;--h:630px;--k:1}
:root.social{--w:1280px;--h:640px;--k:1.04}
*{box-sizing:border-box}
html,body{margin:0;width:var(--w);height:var(--h);overflow:hidden;background:#111016;color:#f6eff7;font-family:"Onest",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 40%}
.shade{position:absolute;inset:0;background:
  linear-gradient(90deg,#100d16e0 0%,#100d16b8 32%,#100d1640 54%,transparent 72%),
  linear-gradient(0deg,#100d1690,transparent 30%),
  linear-gradient(180deg,#100d1650,transparent 22%)}
.copy{position:absolute;left:calc(60px * var(--k));top:calc(46px * var(--k));bottom:calc(46px * var(--k));width:calc(560px * var(--k));display:flex;flex-direction:column;align-items:flex-start}
.logo{width:calc(150px * var(--k));height:auto;filter:drop-shadow(0 4px 24px #17101880)}
.kicker{margin:calc(24px * var(--k)) 0 0;font:600 calc(16px * var(--k))/1 "Onest";letter-spacing:.24em;text-transform:uppercase;color:#f6eff7d9}
h1{margin:calc(12px * var(--k)) 0 0;font:500 calc(68px * var(--k))/1.04 "Urbanist";letter-spacing:0;text-wrap:balance;
  background:linear-gradient(110deg,#b59aff 0%,#e896d7 24%,#ff7eb3 48%,#ffbd92 74%,#fff0d4 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.06em}
.sub{margin:calc(14px * var(--k)) 0 0;font:460 calc(25px * var(--k))/1.35 "Onest";color:#eee4f0;max-width:19em}
.cta{margin-top:auto;display:inline-flex;align-items:center;gap:calc(12px * var(--k));padding:calc(15px * var(--k)) calc(26px * var(--k));border-radius:999px;
  background:#f4b5cb;color:#241a23;font:640 calc(24px * var(--k))/1 "Onest";letter-spacing:.005em;box-shadow:0 10px 30px #0006}
.cta svg{width:calc(26px * var(--k));height:calc(26px * var(--k));flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ticket{position:absolute;left:calc(600px * var(--k));top:calc(178px * var(--k));width:calc(820px * var(--k));transform:rotate(-5deg);transform-origin:0 50%;filter:drop-shadow(0 30px 60px #000a)}
.ticket svg{display:block;width:100%;height:auto}
</style>
</head>
<body>
<img class="photo" src="img/hero-2560.jpg" alt="">
<div class="shade"></div>
<div class="ticket" id="ticket"></div>
<div class="copy">
  <img class="logo" src="img/gta-vi.png" alt="">
  <p class="kicker">FlyUS GT406 · LSX → VCI</p>
  <h1>Your seat to Vice City.</h1>
  <p class="sub">Type your name, get your own boarding pass. Lands 19 Nov 2026.</p>
  <p class="cta"><svg viewBox="0 0 24 24"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2M13 17v2M13 11v2"/></svg>boardingpass.nichtlegacy.com</p>
</div>
<script type="module">
import { derive } from '../site/js/passenger.js';
import { buildTicketSVG, fontsReady } from '../site/js/ticket.js';

document.documentElement.classList.toggle('social', location.hash === '#1280x640');
await fontsReady();
await document.fonts.load('640 24px Onest'); await document.fonts.load('500 68px Urbanist');
document.getElementById('ticket').innerHTML = buildTicketSVG(derive(''), { theme: 'night', prefix: 'og-t-' });
await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
document.body.dataset.ready = '1';
</script>
</body>
</html>
