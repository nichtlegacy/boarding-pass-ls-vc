<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FlyUS boarding pass · Flight GT406</title>

<style>
/* Iframe embed of one ticket (spec C.8). Transparent page so the die-cut corners show the host's background. */
@font-face{font-family:"GT406 Sans";src:url("fonts/carlito-400.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"GT406 Sans";src:url("fonts/carlito-700.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"GT406 Sans";src:url("fonts/carlito-700i.woff2") format("woff2");font-weight:700;font-style:italic;font-display:swap}
@font-face{font-family:"Archivo Expanded";src:url("fonts/archivo-expanded-900.woff2") format("woff2");font-weight:900;font-style:normal;font-display:swap}
@font-face{font-family:"Arimo";src:url("fonts/arimo-700i.woff2") format("woff2");font-weight:700;font-style:italic;font-display:swap}
html{background:transparent;color-scheme:light dark}
body{margin:0}
a{position:relative;display:block;color:inherit;text-decoration:none;border-radius:1.4%/3.4%}
a:focus-visible{outline:2px solid #f3a6bf;outline-offset:-2px}
svg{display:block;width:100%;height:auto}
.pill{position:absolute;right:10px;bottom:10px;padding:6px 10px;border-radius:999px;background:#120f24b3;color:#fff;
  font:700 12px/1 "GT406 Sans",Carlito,Calibri,sans-serif;letter-spacing:.02em;opacity:0;transform:translateY(4px);
  transition:opacity .2s cubic-bezier(.22,1,.36,1),transform .2s cubic-bezier(.22,1,.36,1);pointer-events:none}
a:hover .pill,a:focus-visible .pill{opacity:1;transform:none}
@media (hover:none){.pill{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pill{transition:none}}
.nojs{font:16px/1.4 system-ui,sans-serif;padding:12px}
</style>
</head>
<body>
<a id="pass" href="https://boardingpass.nichtlegacy.com/" target="_blank" rel="noopener"><noscript><span class="nojs">FlyUS boarding pass for flight GT406 ↗</span></noscript></a>

<script type="module">
import { derive, shareUrl } from './js/passenger.js';
import { buildTicketSVG, altText, fontsReady, FORMATS } from './js/ticket.js';
import { THEME_IDS } from './js/themes.js';

const q = new URLSearchParams(location.search);
const p = derive(q.get('name'));
const format = FORMATS[q.get('format')] ? q.get('format') : 'ticket';
const asked = q.get('theme');
// "auto" (the default) follows the host page's colour scheme and switches live with it.
const dark = matchMedia('(prefers-color-scheme: dark)');
const theme = () => (THEME_IDS.includes(asked) ? asked : dark.matches ? 'night' : 'keys');

const a = document.getElementById('pass');
a.href = shareUrl(p.name);   // ghost: the site root
a.setAttribute('aria-label', altText(p, format) + ' Opens the generator in a new tab.');

// Name fitting measures with the ticket font, so render only once it is loaded.
await fontsReady();
const render = () => {
  a.innerHTML = buildTicketSVG(p, { format, theme: theme(), prefix: 'em-' }) + '<span class="pill" aria-hidden="true">Get yours ↗</span>';
};
render();
if (!THEME_IDS.includes(asked)) dark.addEventListener('change', render);
</script>
</body>
</html>
