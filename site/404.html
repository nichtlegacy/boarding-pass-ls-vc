<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Flight GT406</title>
<meta name="robots" content="noindex, follow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111016">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
<style>
.notfound{min-height:100svh;display:grid;place-items:center;padding:40px var(--gutter);text-align:center;background:radial-gradient(ellipse 60% 45% at 50% 46%,#71415c3a,transparent 70%)}
.notfound{position:relative;isolation:isolate}
.notfound::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--grain);opacity:.08;mix-blend-mode:overlay;pointer-events:none}
.notfound .wrap{display:flex;flex-direction:column;align-items:center;gap:22px}
.notfound .eyebrow{color:var(--accent)}
.notfound h1{font:var(--fw-display) var(--fs-h2)/var(--lh-h2) var(--font);letter-spacing:var(--ls-h2);--ink-pos:55%;text-wrap:balance;max-width:14ch}
.notfound .lede{font-size:var(--fs-lead);color:var(--muted)}
.actions-404{margin-top:12px}
.actions-404 .btn{text-decoration:none}
</style>
</head>
<body>
<main class="notfound">
  <div class="wrap">
    <p class="eyebrow micro">Error 404</p>
    <h1 class="ink">This gate does not exist.</h1>
    <p class="lede">Flight GT406 boards from the front page.</p>
    <div class="actions-404"><a class="btn primary" href="/">Back to the gate</a></div>
  </div>
</main>
</body>
</html>
